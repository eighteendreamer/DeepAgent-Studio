<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepAgent · 模型设置设计选项</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#25272c;background:#f6f6f5;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus{outline:2px solid #b4b4b0;outline-offset:2px}button{border:1px solid #dededb;background:white;border-radius:8px;padding:8px 12px;color:inherit}button:hover{background:#f1f1ee}.demo-switcher{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#25272c;color:white;gap:16px}.options{display:flex;gap:6px}.options button{color:#d3d3d0;border:0;background:transparent}.options button[aria-pressed=true]{background:#f7f7f5;color:#25272c}.topbar{height:40px;display:flex;align-items:center;gap:20px;padding:0 16px;color:#777;background:#f6f6f5;border-bottom:1px solid #e5e5e2}.topbar span:last-child{margin-left:auto;letter-spacing:16px}.shell{display:grid;grid-template-columns:64px 216px minmax(0,1fr);min-height:calc(100vh - 104px)}.rail{display:flex;flex-direction:column;align-items:center;gap:20px;padding:22px 0;color:#777;border-right:1px solid #e8e8e5;font-size:22px}.rail .bottom{margin-top:auto}.settings{padding:24px 12px;border-right:1px solid #e8e8e5}.back{color:#888;padding:0 10px 24px}.settings div.item{padding:11px 12px;color:#777;border-radius:7px;margin:3px 0}.settings .item.selected{background:#e8e8e4;color:#25272c;font-weight:600}main{padding:40px 48px;background:white;min-width:0}.page{max-width:1040px;margin:auto}.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.page-head h1{font-size:24px;letter-spacing:-.6px;margin:0}.primary{background:#25272c;color:white;border-color:#25272c}.primary:hover{background:#45474a}.providers{display:flex;gap:8px;border-bottom:1px solid #e7e7e3;padding-bottom:16px;margin-bottom:24px}.provider{display:flex;align-items:center;gap:9px;padding:8px 14px;border-color:transparent;background:#f6f6f4}.provider[aria-pressed=true]{border-color:#bdbdb6;background:white}.logo{display:flex;align-items:center;justify-content:center;width:28px;height:28px;flex-shrink:0;background:white;border:1px solid #e7e7e3;border-radius:7px;font-weight:600}.logo img{width:100%;height:100%;object-fit:contain;padding:3px}.muted{color:#8a8b88;font-size:12px}.provider-summary{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.identity{display:flex;align-items:center;gap:12px}.identity .logo{width:40px;height:40px;border-radius:9px}.identity strong{font-size:16px}.identity .muted{margin-top:6px}.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#777}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:#389d6b}.summary-actions{display:flex;align-items:center;gap:8px}.text-button{border:0;background:transparent;color:#777}.section-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:12px}.section-head h2{font-size:14px;margin:0}.section-head input{padding:8px 12px;border:1px solid #e4e4e0;border-radius:8px;width:220px;background:#fafaf8}.table{width:100%;border-collapse:collapse}.table th{background:#fafaf8;color:#898a85;font-size:12px;font-weight:400;text-align:left;padding:12px 14px;border-bottom:1px solid #e6e6e2}.table td{padding:17px 14px;border-bottom:1px solid #efefec}.table td:first-child{font-weight:500}.table td:nth-child(2),.table td:nth-child(3){font-size:12px;color:#888}.table th:last-child,.table td:last-child{text-align:right}.toggle{display:inline-flex;align-items:center;width:29px;height:17px;border-radius:20px;border:0;padding:2px;background:#ddd}.toggle.on{background:#353733}.toggle:after{content:"";width:13px;height:13px;background:white;border-radius:50%}.toggle.on:after{margin-left:auto}.edit{font-size:12px;color:#777;border:0;padding:5px 9px;margin-left:16px;background:transparent}.layout-b .page{display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:32px}.layout-b .page-head{grid-column:1/-1}.layout-b .providers{grid-row:2/5;display:flex;flex-direction:column;border:0;border-right:1px solid #eee;padding-right:20px}.layout-b .provider{background:transparent}.layout-b .provider[aria-pressed=true]{background:#f1f1ee;border-color:transparent}.layout-b .provider-summary{align-items:flex-start}.layout-b .summary-actions{gap:0}.layout-c .providers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:0;gap:12px}.layout-c .provider{justify-content:flex-start;min-height:76px;background:white;border:1px solid #e8e8e3;padding:15px}.layout-c .provider[aria-pressed=true]{border-color:#43453f;box-shadow:0 0 0 1px #43453f}.layout-c .provider-summary{background:#fafaf8;border-radius:10px;padding:18px}.layout-c .table th{background:white}.choice-note{color:#a8a9a3;font-size:12px}.modal{border:1px solid #e7e7e3;border-radius:14px;padding:0;width:480px;max-width:90vw;box-shadow:0 20px 80px #0002}.modal::backdrop{background:#0003}.modal header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;font-weight:600}.modal header button{border:0;padding:2px 5px}.form{padding:0 24px 24px;display:grid;gap:18px}.form label{font-size:12px;color:#777;display:grid;gap:8px}.form input,.form select{height:38px;border:1px solid #deded9;border-radius:7px;padding:8px;background:white}.upload-row{display:grid;grid-template-columns:72px 1fr;align-items:end;gap:16px}.upload{width:72px;height:72px;aspect-ratio:1;background:#fafaf8}.modal footer{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #eee;padding:14px 24px}.dual{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:1000px){.shell{grid-template-columns:50px minmax(0,1fr)}.settings{display:none}main{padding:28px 24px}.layout-b .page{grid-template-columns:160px minmax(0,1fr)}.summary-actions{flex-wrap:wrap;justify-content:flex-end}.table td,.table th{padding:12px 7px}}@media(max-width:680px){.demo-switcher{height:auto;flex-direction:column;padding:12px}.choice-note{display:none}.layout-b .page{display:block}.layout-b .providers{border:0}.providers,.layout-c .providers{display:flex;flex-wrap:wrap}.table td:nth-child(3),.table th:nth-child(3){display:none}.provider-summary{align-items:flex-start}.summary-actions{max-width:140px}}
</style></head><body>
<div class="demo-switcher"><strong>模型设置 · 交互原型</strong><div class="options"><button data-layout="a" aria-pressed="true">A · 横向供应商</button><button data-layout="b" aria-pressed="false">B · 紧凑工作台</button><button data-layout="c" aria-pressed="false">C · 供应商卡片</button></div><span class="choice-note">仅预览，不修改应用配置</span></div>
<header class="topbar"><span>☰</span><span>←　→</span><span>DeepAgent Studio</span><span>— □ ×</span></header>
<div class="shell"><nav class="rail"><span>⌂</span><span>✎</span><span>⌕</span><span>▱</span><span>▣</span><span>···</span><span class="bottom">⚙</span></nav><aside class="settings"><div class="back">←　返回应用</div><div class="item">⚙　常规</div><div class="item">☼　外观</div><div class="item">☷　配置</div><div class="item selected">◇　模型</div><div class="item">☻　个性化</div><div class="item">⌨　键盘快捷键</div><div class="item">▤　MCP 服务器</div><div class="item">⚓　钩子</div><div class="item">↗　连接</div></aside>
<main id="preview"><div class="page"><div class="page-head"><h1>模型</h1><button class="primary" id="add">＋ 添加供应商</button></div><div class="providers" aria-label="供应商"></div><div class="provider-summary"><div class="identity"><div class="logo" id="selected-logo"></div><div><strong id="selected-name"></strong><div class="muted" id="selected-url"></div></div></div><div class="summary-actions"><span class="status">已配置</span><button class="text-button" id="website">官网 ↗</button><button id="configure">配置</button><button class="text-button" id="more">···</button></div></div><div class="section-head"><h2>可用模型 <span class="muted" id="count"></span></h2><div style="display:flex;gap:8px"><input id="search" placeholder="搜索模型" aria-label="搜索模型"><button id="refresh">↻ 同步模型</button></div></div><table class="table"><thead><tr><th>模型</th><th>上下文</th><th>输出上限</th><th>启用 / 编辑</th></tr></thead><tbody id="models"></tbody></table></div></main></div>
<dialog class="modal" id="editor"><form method="dialog"><header><span id="dialog-title">配置供应商</span><button aria-label="关闭">×</button></header><div class="form"><div class="upload-row"><button type="button" class="upload" id="upload">＋<br><small>上传图标</small></button><label>供应商名称<input id="provider-name" placeholder="例如 DeepSeek"></label></div><input type="file" hidden id="logo-file" accept="image/*"><label>API 地址<input id="api-url" placeholder="https://api.example.com/v1"></label><div class="dual"><label>协议<select><option>Responses</option><option>Chat Completions</option><option>Messages</option></select></label><label>余额查询<select><option>自动探测</option><option>官方接口</option></select></label></div><label>API Key<input type="password" placeholder="已保存，留空保持不变"></label><label>官网<input id="web-url" placeholder="https://example.com"></label></div><footer><button>取消</button><button class="primary">保存</button></footer></form></dialog>
<script>
const providers=[{id:'deepseek',name:'DeepSeek',url:'https://api.deepseek.com',logo:'../../apps/desktop/public/providers/deepseek.svg',website:'https://www.deepseek.com/',models:['deepseek-flash','deepseek-v4-pro']},{id:'layso',name:'Layso',url:'https://api.layso.ai/v1',logo:'../../apps/desktop/public/providers/layso.webp',website:'https://layso.ai/',models:['gpt-5.6-sol','claude-opus-4.6','gemini-3-pro']},{id:'custom',name:'自定义供应商',url:'https://api.example.com/v1',logo:'',website:'',models:['custom-model']}];let selected=providers[0];const $=id=>document.getElementById(id);function logo(p){return p.logo?`<img src="${p.logo}" alt="">`:p.name[0]}function render(){document.querySelector('.providers').innerHTML=providers.map(p=>`<button class="provider" data-provider="${p.id}" aria-pressed="${p.id===selected.id}"><span class="logo">${logo(p)}</span>${p.name}</button>`).join('');$('selected-logo').innerHTML=logo(selected);$('selected-name').textContent=selected.name;$('selected-url').textContent=selected.url+' · Responses';$('count').textContent=selected.models.length;$('models').innerHTML=selected.models.filter(n=>n.includes($('search').value)).map((n,i)=>`<tr><td>${n}</td><td>128,000</td><td>8,192</td><td><button class="toggle ${i<2?'on':''}" aria-label="启用 ${n}"></button><button class="edit">编辑</button></td></tr>`).join('')}document.querySelector('.options').onclick=e=>{if(!e.target.dataset.layout)return;document.querySelectorAll('[data-layout]').forEach(n=>n.setAttribute('aria-pressed',n===e.target));$('preview').className='layout-'+e.target.dataset.layout};document.querySelector('.providers').onclick=e=>{const b=e.target.closest('[data-provider]');if(b){selected=providers.find(p=>p.id===b.dataset.provider);$('search').value='';render()}};$('search').oninput=render;$('models').onclick=e=>{if(e.target.classList.contains('toggle'))e.target.classList.toggle('on');if(e.target.classList.contains('edit'))openEditor(false)};function openEditor(add){$('dialog-title').textContent=add?'添加供应商':'配置供应商';$('provider-name').value=add?'':selected.name;$('api-url').value=add?'':selected.url;$('web-url').value=add?'':selected.website;$('editor').showModal()}$('add').onclick=()=>openEditor(true);$('configure').onclick=()=>openEditor(false);$('website').onclick=()=>{if(selected.website)window.open(selected.website,'_blank','noopener,noreferrer')};$('more').onclick=()=>confirm('删除此供应商？（原型不会修改实际数据）');$('upload').onclick=()=>$('logo-file').click();$('refresh').onclick=()=>{$('refresh').textContent='✓ 已同步';setTimeout(()=>$('refresh').textContent='↻ 同步模型',1000)};render();
</script></body></html>
