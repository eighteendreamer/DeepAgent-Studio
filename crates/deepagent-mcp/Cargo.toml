[package]
name = "deepagent-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Model Context Protocol (MCP): config (.mcp.json), JSON-RPC client, transports (stdio/SSE/HTTP/ws), and namespaced remote tools."

[features]
default = []
# The real network transport (reqwest + rustls) for HTTP/SSE MCP servers. Kept
# optional so the default build and CI exercise the client/registry fully
# offline via the mock transport, without pulling a TLS stack.
http = ["dep:reqwest"]

[dependencies]
deepagent-core.workspace = true
deepagent-tools.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true }

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
], optional = true }

[dev-dependencies]
tempfile.workspace = true
