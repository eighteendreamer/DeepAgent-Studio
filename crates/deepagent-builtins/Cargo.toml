[package]
name = "deepagent-builtins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Built-in tool set aligned with Claude Code: read/write/edit/multi_edit/list/glob/grep/bash/todo_write/task_list/web_fetch/web_search, behind the capability registry."

[features]
default = []
# The real network-backed web tools (reqwest). Kept optional so the default
# build and CI stay offline; the WebClient trait + tools are tested via a mock
# without this feature.
http = ["dep:reqwest", "dep:url"]

[dependencies]
deepagent-core.workspace = true
deepagent-codegraph.workspace = true
deepagent-tools.workspace = true
deepagent-hooks.workspace = true
# `skill_tool` (channel B of the skill-marketplace auto-activation design)
# delegates to `SkillRegistry::body_for_invoke` from the skills crate. The
# skills crate has no edge back to builtins, so this stays cycle-free.
deepagent-skills.workspace = true
deepagent-mobile-core.workspace = true
deepagent-mobile-protocol.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true }
tempfile.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
], optional = true }
# URL query encoding for web_search (only used by the http-backed client).
url = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
