[package]
name = "deepagent-app-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Application-service facade: serializable DTOs and commands bridging the kernel to any UI (Tauri/web)."

[dependencies]
deepagent-core.workspace = true
deepagent-persistence.workspace = true
deepagent-session.workspace = true
deepagent-observation.workspace = true
deepagent-models.workspace = true
deepagent-skills.workspace = true
deepagent-knowledge.workspace = true
deepagent-runtime.workspace = true
deepagent-context.workspace = true
deepagent-tools.workspace = true
deepagent-builtins.workspace = true
deepagent-workspace.workspace = true
deepagent-hooks.workspace = true
deepagent-mcp.workspace = true
deepagent-intent.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true }
# Current date/OS for the dynamic system-prompt environment block (so the model
# never searches a stale year). Already in the workspace lock; offline-safe.
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }
keyring = { version = "3", optional = true }

# Platform-native keychain backends (only the relevant one per OS). keyring v3
# ships no backend by default, so we must enable one explicitly or `set` becomes
# a no-op that never persists. These are additive features on the same crate.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", optional = true, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", optional = true, features = ["sync-secret-service"] }

[features]
default = []
# OS keychain-backed secret storage (Windows Credential Manager / macOS
# Keychain / Linux Secret Service). Off by default so the kernel workspace and
# CI stay free of platform secret-service dependencies; the desktop app turns
# it on.
keychain = ["dep:keyring"]
# Network web tools (web_fetch / web_search) backed by reqwest, registered into
# the ChatService tool registry. Pulls a TLS stack; the desktop app turns it on.
# Also enables the MCP HTTP/SSE network transport so visually-configured hosted
# MCP servers can connect and live-register their tools.
web = ["deepagent-builtins/http", "deepagent-mcp/http"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true }
