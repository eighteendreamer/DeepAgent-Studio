[package]
name = "deepagent-app-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Application-service facade: serializable DTOs and commands bridging the kernel to any UI (Tauri/web)."

[dependencies]
deepagent-core.workspace = true
deepagent-persistence.workspace = true
deepagent-session.workspace = true
deepagent-observation.workspace = true
deepagent-tracing.workspace = true
deepagent-models.workspace = true
deepagent-skills.workspace = true
deepagent-knowledge.workspace = true
deepagent-runtime.workspace = true
deepagent-context.workspace = true
deepagent-tools.workspace = true
deepagent-builtins.workspace = true
deepagent-codegraph.workspace = true
deepagent-workspace.workspace = true
deepagent-hooks.workspace = true
deepagent-mcp.workspace = true
deepagent-terminal.workspace = true
deepagent-intent.workspace = true
deepagent-prompts.workspace = true
deepagent-subagents.workspace = true
deepagent-verification.workspace = true
deepagent-mobile-runtime.workspace = true
deepagent-mobile-core.workspace = true
deepagent-mobile-protocol.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tokio = { workspace = true }
# Concurrent MCP server probing (McpService::connection_status fans out the
# per-server connect + tools/list handshakes with join_all).
futures.workspace = true
# Office document parsing for file preview (Tier C, pure Rust): zip for
# docx/pptx OOXML containers, calamine for xlsx sheet reads.
zip.workspace = true
calamine.workspace = true
pdf-extract.workspace = true
# Pure-Rust xlsx generation (Tier C office document creation).
rust_xlsxwriter.workspace = true
# SHA-256 for verifying downloaded managed runtimes (RuntimeService core).
sha2.workspace = true
base64.workspace = true
aes-gcm.workspace = true
percent-encoding.workspace = true
tempfile.workspace = true
rusqlite.workspace = true
# .tar.gz extraction for managed runtimes (always compiled — small, pure Rust).
tar.workspace = true
flate2.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
# PDF page rendering (Tier R) — optional, behind `pdfium`.
pdfium-render = { workspace = true, optional = true }
image = { workspace = true, optional = true }
# Audio capture (office-agent recording). Optional + behind `audio` so the
# kernel workspace builds without platform audio headers (ALSA on Linux); the
# RecordingService state machine is always compiled via an injected recorder.
cpal = { workspace = true, optional = true }
hound = { workspace = true, optional = true }
# Current date/OS for the dynamic system-prompt environment block (so the model
# never searches a stale year). Already in the workspace lock; offline-safe.
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }
keyring = { version = "3", optional = true }
portable-pty = "0.8"

# Platform-native keychain backends (only the relevant one per OS). keyring v3
# ships no backend by default, so we must enable one explicitly or `set` becomes
# a no-op that never persists. These are additive features on the same crate.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", optional = true, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", optional = true, features = ["sync-secret-service"] }

[features]
default = []
# OS keychain-backed secret storage (Windows Credential Manager / macOS
# Keychain / Linux Secret Service). Off by default so the kernel workspace and
# CI stay free of platform secret-service dependencies; the desktop app turns
# it on.
keychain = ["dep:keyring"]
# Network web tools (web_fetch / web_search) backed by reqwest, registered into
# the ChatService tool registry. Pulls a TLS stack; the desktop app turns it on.
# Also enables the MCP HTTP/SSE network transport so visually-configured hosted
# MCP servers can connect and live-register their tools.
web = ["deepagent-builtins/http", "deepagent-mcp/http", "deepagent-models/http"]
# Real HTTP downloader for managed runtimes (office-agent RuntimeService). The
# RuntimeService core (registry / resolve / sha256 verify / extract) is always
# compiled; this enables the optional image support used by the desktop app.
runtimes = ["dep:image"]
# Real microphone capture for the recording panel (office-agent). The desktop
# app turns it on; without it the RecordingService state machine still compiles
# and runs (capture returns an "audio not enabled" error).
audio = ["dep:cpal", "dep:hound"]
# PDF page rendering via pdfium (office-agent Tier R). OFF by default; the
# pdfium library is loaded at runtime when installed. Without it, PDF preview
# degrades to Tier C text extraction.
pdfium = ["dep:pdfium-render", "dep:image"]

[dev-dependencies]
tokio = { workspace = true }
