[package]
name = "deepagent-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "DeepSeek-native Responses client: input/output items, semantic SSE streaming, tool calls, usage, and reasoning persistence."

[features]
default = []
# The real network transport (reqwest + rustls). Kept optional so the default
# build and CI exercise 100% of the streaming/accumulator logic offline via the
# mock transport. The pinned offline encoder separately pulls upstream Hub/TLS
# dependencies, but the adapter never invokes their network-loading APIs.
http = ["dep:reqwest", "dep:time"]

[dependencies]
# Plan P0/P5: SDK DTOs only; HttpTransport owns networking and cancellation.
# This SDK version is not published on crates.io. Pin its audited MIT source.
anthropic-sdk = { git = "https://github.com/Haleclipse/anthropic-sdk-rs.git", rev = "16dc3e424e7c5041bcc952ebb54d9ec4b2b1ced7" }
deepagent-core.workspace = true
deepagent-tools.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
tokio = { workspace = true }
time = { workspace = true, optional = true }
base64.workspace = true
sha2.workspace = true
url.workspace = true
# Pinned official prompt templates and offline BPE. The upstream encoding crate
# enables tokenizers' HTTP feature transitively; our adapter only uses from_bytes.
deepseek-recipe = "=0.2.0"
deepseek-recipe-encoding = "=0.2.0"
tokenizers = { version = "=0.23.2", default-features = false }
flate2.workspace = true
# Reuse the locked decoder, with only DeepSeek's four raster codecs in the
# default model graph. Existing desktop image features remain unchanged.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

reqwest = { version = "0.12", default-features = false, features = [
    "stream",
    "rustls-tls",
    "multipart",
], optional = true }

[dev-dependencies]
tokio = { workspace = true }
