[package]
name = "deepagent-codegraph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Native Rust code-graph engine: tree-sitter extraction, SQLite (+FTS5) storage, reference resolution, AI queries, and UA JSON projection. One extraction, two consumers (AI tools + human project-map panel)."

[dependencies]
deepagent-core.workspace = true
# SQLite via the workspace `bundled` build. FTS5 ships compiled into the
# bundled SQLite (libsqlite3-sys bundled defines SQLITE_ENABLE_FTS5), so the
# `nodes_fts` virtual table works at the SQL level with no extra feature flag.
rusqlite.workspace = true
# tree-sitter core + pure-Rust-compilable grammars (C grammar built via cc, no Node / no runtime download).
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-go.workspace = true
# File scanning / .gitignore handling.
ignore.workspace = true
# Content hashing for incremental change detection.
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
notify = "8.2.0"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-bash = "0.25.1"
tree-sitter-lua = "0.5.0"
tree-sitter-swift = "0.7.3"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-scala = "0.26.0"
tree-sitter-dart = "0.2.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"

[dev-dependencies]
tempfile.workspace = true
