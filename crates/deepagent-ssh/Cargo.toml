[package]
name = "deepagent-ssh"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
authors = ["DeepAgent Studio"]
description = "SSH long-lived connection service for DeepAgent Studio: config management, native SSH connections, command execution, and terminal I/O."

[dependencies]
# Internal crates — absolute paths to avoid workspace-relative path issues.
deepagent-terminal = { path = "../deepagent-terminal" }
deepagent-core = { path = "../deepagent-core" }
deepagent-persistence = { path = "../deepagent-persistence" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# One protocol engine for host verification, authentication, exec, PTY and SFTP.
russh = { version = "0.65.2", default-features = false, features = ["rsa", "flate2", "ring"] }
russh-sftp = "=2.1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
async-trait = "0.1"
base64 = "0.22"
httparse = "1.10.1"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3.8"

[target.'cfg(windows)'.dependencies]
# Already locked Win32 bindings; ordinal comparison follows the host name rules.
windows-sys = { version = "0.59", features = ["Win32_Globalization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Independent historical handshake control; not used by production transport.
async-ssh2-tokio = "0.12.2"
rand = "0.10"
tempfile = "3.8"
tokio = { version = "1", features = ["test-util", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
