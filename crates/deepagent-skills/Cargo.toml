[package]
name = "deepagent-skills"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Skill system aligned with Claude Code: SKILL.md progressive disclosure, auto-discovery, dynamic registration, install/uninstall, and active/passive (trigger-matched) activation."

[dependencies]
deepagent-core.workspace = true
deepagent-context.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# SkillsMP marketplace client + GitHub raw / codeload downloader (see
# `marketplace.rs`). The client streams responses and caps downloads at
# 50 MB; the downloader extracts a `tempfile::TempDir` and rejects path
# traversal / symlink entries before writing to disk.
async-trait.workspace = true
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
regex = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { workspace = true }
