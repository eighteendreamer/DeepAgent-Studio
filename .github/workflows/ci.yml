name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Lint & format
  # ---------------------------------------------------------------------------
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 🔥 关键修复：dbus 依赖系统库
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: clippy (models http transport)
        run: cargo clippy -p deepagent-models --features http --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Test matrix
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 🔥 Linux 才需要 dbus
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libdbus-1-dev

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: E2E stabilization tests
        run: cargo test -p deepagent-runtime --test e2e_stabilization

      - name: Build with optional http transport
        run: cargo build -p deepagent-models --features http

      - name: Smoke-test runtime CLI
        run: cargo run -p deepagent-cli

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    name: desktop frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Runs before the build: a bundled third-party plugin missing its license
      # is a distribution problem, and failing fast keeps it out of an artifact.
      - name: Check bundled plugin licenses
        run: node scripts/check-plugin-licenses.cjs

      - name: Type-check + build
        run: pnpm build
