<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ececec" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 700 34px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #111827; }
      .layer-label { font: 600 20px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #374151; }
      .box-title { font: 600 19px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #111827; }
      .box-text { font: 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #4b5563; }
      .small { font: 14px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #4b5563; }
      .tiny { font: 12px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #6b7280; }
      .layer { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 6; }
      .module { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 6; }
      .soft { fill: #fbfbfb; stroke: #374151; stroke-width: 1.8; rx: 6; }
      .cylinder { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .arrow { stroke: #4b5563; stroke-width: 1.8; marker-end: url(#arrow); fill: none; }
      .dash { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1400" height="1050" fill="url(#grid)"/>
  <text x="70" y="58" class="title">DeepAgent Studio 系统技术架构图</text>

  <!-- left layer labels -->
  <rect x="80" y="95" width="140" height="64" class="layer"/>
  <text x="150" y="134" text-anchor="middle" class="layer-label">用户层</text>

  <rect x="80" y="185" width="140" height="82" class="layer"/>
  <text x="150" y="234" text-anchor="middle" class="layer-label">表现层</text>

  <rect x="80" y="295" width="140" height="82" class="layer"/>
  <text x="150" y="344" text-anchor="middle" class="layer-label">接入层</text>

  <rect x="80" y="405" width="140" height="124" class="layer"/>
  <text x="150" y="474" text-anchor="middle" class="layer-label">应用服务层</text>

  <rect x="80" y="557" width="140" height="182" class="layer"/>
  <text x="150" y="655" text-anchor="middle" class="layer-label">运行时内核层</text>

  <rect x="80" y="767" width="140" height="96" class="layer"/>
  <text x="150" y="823" text-anchor="middle" class="layer-label">集成层</text>

  <rect x="80" y="891" width="140" height="74" class="layer"/>
  <text x="150" y="936" text-anchor="middle" class="layer-label">存储层</text>

  <!-- user layer -->
  <rect x="270" y="95" width="1020" height="64" class="module"/>
  <text x="780" y="121" text-anchor="middle" class="box-title">用户 / 开发者</text>
  <text x="780" y="145" text-anchor="middle" class="box-text">新建对话、选择项目、审批工具、查看知识库、管理设置与 MCP</text>

  <!-- presentation layer -->
  <rect x="270" y="185" width="1020" height="82" class="module"/>
  <text x="780" y="213" text-anchor="middle" class="box-title">Tauri Desktop UI - React 18 + TypeScript + Vite + Tailwind</text>
  <rect x="310" y="228" width="145" height="28" class="soft"/>
  <text x="382" y="247" text-anchor="middle" class="small">Sidebar</text>
  <rect x="475" y="228" width="145" height="28" class="soft"/>
  <text x="548" y="247" text-anchor="middle" class="small">ChatView</text>
  <rect x="640" y="228" width="145" height="28" class="soft"/>
  <text x="712" y="247" text-anchor="middle" class="small">Settings</text>
  <rect x="805" y="228" width="145" height="28" class="soft"/>
  <text x="878" y="247" text-anchor="middle" class="small">Knowledge</text>
  <rect x="970" y="228" width="145" height="28" class="soft"/>
  <text x="1042" y="247" text-anchor="middle" class="small">Panels</text>
  <rect x="1135" y="228" width="115" height="28" class="soft"/>
  <text x="1192" y="247" text-anchor="middle" class="small">i18n</text>

  <!-- access layer -->
  <rect x="270" y="295" width="1020" height="82" class="module"/>
  <text x="780" y="323" text-anchor="middle" class="box-title">Tauri v2 接入层</text>
  <rect x="315" y="338" width="270" height="28" class="soft"/>
  <text x="450" y="357" text-anchor="middle" class="small">IPC Commands / invoke</text>
  <rect x="615" y="338" width="270" height="28" class="soft"/>
  <text x="750" y="357" text-anchor="middle" class="small">chat://event / approval stream</text>
  <rect x="915" y="338" width="290" height="28" class="soft"/>
  <text x="1060" y="357" text-anchor="middle" class="small">AppState + Tokio Runtime</text>

  <!-- service layer -->
  <rect x="270" y="405" width="1020" height="124" class="module"/>
  <text x="780" y="432" text-anchor="middle" class="box-title">deepagent-app-core 应用服务门面</text>
  <rect x="310" y="452" width="135" height="30" class="soft"/>
  <text x="378" y="472" text-anchor="middle" class="small">AppService</text>
  <rect x="465" y="452" width="135" height="30" class="soft"/>
  <text x="532" y="472" text-anchor="middle" class="small">ChatService</text>
  <rect x="620" y="452" width="135" height="30" class="soft"/>
  <text x="688" y="472" text-anchor="middle" class="small">Settings</text>
  <rect x="775" y="452" width="135" height="30" class="soft"/>
  <text x="842" y="472" text-anchor="middle" class="small">Projects</text>
  <rect x="930" y="452" width="135" height="30" class="soft"/>
  <text x="998" y="472" text-anchor="middle" class="small">Knowledge</text>
  <rect x="1085" y="452" width="135" height="30" class="soft"/>
  <text x="1152" y="472" text-anchor="middle" class="small">MCP</text>
  <rect x="310" y="492" width="135" height="26" class="soft"/>
  <text x="378" y="510" text-anchor="middle" class="tiny">Archive</text>
  <rect x="465" y="492" width="135" height="26" class="soft"/>
  <text x="532" y="510" text-anchor="middle" class="tiny">SessionState</text>
  <rect x="620" y="492" width="135" height="26" class="soft"/>
  <text x="688" y="510" text-anchor="middle" class="tiny">Cost</text>
  <rect x="775" y="492" width="135" height="26" class="soft"/>
  <text x="842" y="510" text-anchor="middle" class="tiny">Terminal</text>
  <rect x="930" y="492" width="135" height="26" class="soft"/>
  <text x="998" y="510" text-anchor="middle" class="tiny">Skills</text>
  <rect x="1085" y="492" width="135" height="26" class="soft"/>
  <text x="1152" y="510" text-anchor="middle" class="tiny">Diagnostics</text>

  <!-- runtime layer -->
  <rect x="270" y="557" width="1020" height="182" class="module"/>
  <text x="780" y="584" text-anchor="middle" class="box-title">Agent Runtime Kernel - Rust Workspace</text>
  <rect x="310" y="604" width="170" height="42" class="soft"/>
  <text x="395" y="623" text-anchor="middle" class="small">deepagent-runtime</text>
  <text x="395" y="640" text-anchor="middle" class="tiny">THINK / EXECUTE / OBSERVE</text>
  <rect x="505" y="604" width="150" height="42" class="soft"/>
  <text x="580" y="623" text-anchor="middle" class="small">models</text>
  <text x="580" y="640" text-anchor="middle" class="tiny">DeepSeek SSE</text>
  <rect x="680" y="604" width="150" height="42" class="soft"/>
  <text x="755" y="623" text-anchor="middle" class="small">tools</text>
  <text x="755" y="640" text-anchor="middle" class="tiny">registry / permission</text>
  <rect x="855" y="604" width="150" height="42" class="soft"/>
  <text x="930" y="623" text-anchor="middle" class="small">builtins</text>
  <text x="930" y="640" text-anchor="middle" class="tiny">file / bash / web</text>
  <rect x="1030" y="604" width="150" height="42" class="soft"/>
  <text x="1105" y="623" text-anchor="middle" class="small">hooks</text>
  <text x="1105" y="640" text-anchor="middle" class="tiny">lifecycle / veto</text>

  <rect x="310" y="666" width="135" height="40" class="soft"/>
  <text x="378" y="690" text-anchor="middle" class="small">session</text>
  <rect x="465" y="666" width="135" height="40" class="soft"/>
  <text x="532" y="690" text-anchor="middle" class="small">context</text>
  <rect x="620" y="666" width="135" height="40" class="soft"/>
  <text x="688" y="690" text-anchor="middle" class="small">workspace</text>
  <rect x="775" y="666" width="135" height="40" class="soft"/>
  <text x="842" y="690" text-anchor="middle" class="small">memory</text>
  <rect x="930" y="666" width="135" height="40" class="soft"/>
  <text x="998" y="690" text-anchor="middle" class="small">knowledge</text>
  <rect x="1085" y="666" width="135" height="40" class="soft"/>
  <text x="1152" y="690" text-anchor="middle" class="small">mcp</text>

  <text x="780" y="724" text-anchor="middle" class="tiny">core events / prompts / intent / verification / planner / subagents / observation / security / tracing</text>

  <!-- integration layer -->
  <rect x="270" y="767" width="1020" height="96" class="module"/>
  <text x="780" y="794" text-anchor="middle" class="box-title">外部集成与执行环境</text>
  <rect x="320" y="815" width="150" height="32" class="soft"/>
  <text x="395" y="836" text-anchor="middle" class="small">DeepSeek API</text>
  <rect x="500" y="815" width="150" height="32" class="soft"/>
  <text x="575" y="836" text-anchor="middle" class="small">MCP Servers</text>
  <rect x="680" y="815" width="150" height="32" class="soft"/>
  <text x="755" y="836" text-anchor="middle" class="small">Public Web</text>
  <rect x="860" y="815" width="150" height="32" class="soft"/>
  <text x="935" y="836" text-anchor="middle" class="small">Local FS</text>
  <rect x="1040" y="815" width="150" height="32" class="soft"/>
  <text x="1115" y="836" text-anchor="middle" class="small">Shell / OS</text>

  <!-- storage layer -->
  <rect x="270" y="891" width="1020" height="74" class="module"/>
  <text x="780" y="916" text-anchor="middle" class="box-title">存储与真相源</text>
  <ellipse cx="390" cy="938" rx="58" ry="16" class="cylinder"/>
  <path d="M332 938 v18 c0 9 116 9 116 0 v-18" class="cylinder"/>
  <text x="390" y="958" text-anchor="middle" class="tiny">SQLite</text>
  <rect x="500" y="925" width="165" height="30" class="soft"/>
  <text x="582" y="945" text-anchor="middle" class="small">Event Log</text>
  <rect x="690" y="925" width="165" height="30" class="soft"/>
  <text x="772" y="945" text-anchor="middle" class="small">Document Store</text>
  <rect x="880" y="925" width="165" height="30" class="soft"/>
  <text x="962" y="945" text-anchor="middle" class="small">Markdown Vault</text>
  <rect x="1070" y="925" width="165" height="30" class="soft"/>
  <text x="1152" y="945" text-anchor="middle" class="small">OS Keychain</text>

  <!-- arrows -->
  <path d="M780 159 L780 185" class="arrow"/>
  <path d="M780 267 L780 295" class="arrow"/>
  <path d="M780 377 L780 405" class="arrow"/>
  <path d="M780 529 L780 557" class="arrow"/>
  <path d="M780 739 L780 767" class="arrow"/>
  <path d="M780 863 L780 891" class="arrow"/>

  <path d="M395 815 C395 760 505 710 580 650" class="dash"/>
  <path d="M575 815 C600 760 980 715 1152 706" class="dash"/>
  <path d="M755 815 C760 760 875 690 930 646" class="dash"/>
  <path d="M935 815 C900 760 780 715 688 706" class="dash"/>
  <path d="M1115 815 C1110 760 1010 690 930 646" class="dash"/>

  <text x="70" y="1010" class="tiny">说明：会话以 SQLite append-only Event Log 为真相源；知识以 Markdown Vault 为真相源；API Key 存入系统 Keychain。</text>
</svg>
