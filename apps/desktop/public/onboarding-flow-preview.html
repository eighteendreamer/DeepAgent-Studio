<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>完整初始化 · 动效预览 | DeepAgent Studio</title>
  <style>
    :root { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-synthesis: none; color-scheme: light; --bg:#fff; --canvas:#f2f2f3; --fg:#1f2937; --muted:#6b7280; --border:#d1d5db; --selected:#f0f1f2; --hover:#f7f7f8; --accent:#339cff; --error:#c44949; --tint:rgba(17,24,39,.045); --seam:rgba(17,24,39,.58); --shadow:0 24px 65px -20px rgba(17,24,39,.24); }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#171717; --canvas:#202020; --fg:#ededed; --muted:#a0a0a0; --border:#414141; --selected:#292929; --hover:#242424; --accent:#70adff; --error:#f18c8c; --tint:rgba(255,255,255,.04); --seam:rgba(255,255,255,.72); --shadow:0 24px 65px -20px rgba(0,0,0,.5); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--fg); background:var(--canvas); }
    button,input,textarea,select { font:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:default; }
    button:focus-visible,a:focus-visible,select:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    button,a,input,textarea { -webkit-tap-highlight-color:transparent; }
    svg { width:18px; height:18px; flex-shrink:0; }
    [hidden] { display:none !important; }
    .app { min-height:100svh; position:relative; }
    .titlebar { position:relative; height:32px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; background:var(--selected); color:var(--muted); font-size:11px; z-index:5; }
    .titlebar nav { display:flex; align-items:center; gap:22px; }
    .titlebar svg { width:15px; height:15px; }
    .app-name { font-weight:500; font-size:11px; opacity:.75; }
    .stage { position:absolute; inset:32px 0 58px; min-height:0; overflow:hidden; background:var(--bg); }
    .workspace { position:absolute; inset:0; display:grid; grid-template-columns:220px minmax(0,1fr); }
    .sidebar { padding:24px 14px; background:var(--selected); display:flex; flex-direction:column; gap:22px; color:var(--muted); font-size:12px; }
    .sidebar .nav-row { display:flex; align-items:center; gap:10px; padding:8px 10px; }
    .sidebar h3 { margin:0 10px 10px; font-size:11px; font-weight:500; }
    .sidebar .project { color:var(--fg); }
    .workspace-main { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; }
    .workspace-main .welcome-logo { width:42px; height:42px; object-fit:contain; margin-bottom:16px; }
    .workspace-main h2 { font-size:28px; font-weight:550; margin:0 0 10px; letter-spacing:-.025em; }
    .workspace-main p { font-size:13px; color:var(--muted); margin:0 0 32px; }
    .composer { width:min(620px,100%); border:1px solid var(--border); border-radius:16px; padding:16px; background:var(--bg); }
    .composer textarea { width:100%; resize:none; border:0; outline:0; background:none; color:var(--fg); height:58px; font-size:14px; }
    .composer-tools { display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:11px; }
    .composer-tools .send { display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:8px; background:var(--fg); color:var(--bg); opacity:.4; }
    .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; overflow:hidden; z-index:10; }
    .doors { position:absolute; inset:0; pointer-events:none; }
    .door { position:absolute; inset-block:0; width:50%; background:var(--bg); }
    .door::before { content:""; position:absolute; inset:0; background:var(--tint); }
    .door.left { left:0; }
    .door.right { right:0; }
    .seam { position:absolute; top:0; height:100%; width:1px; opacity:0; background:var(--seam); }
    .left .seam { right:0; }
    .right .seam { left:0; }
    .point { position:absolute; left:50%; top:50%; width:1px; height:1px; opacity:0; background:var(--seam); transform:translate(-50%,-50%); transform-origin:center; z-index:2; }
    .welcome-text { position:absolute; z-index:4; white-space:nowrap; font-size:clamp(18px,2.4vw,30px); font-weight:700; line-height:36px; letter-spacing:.05em; opacity:0; visibility:hidden; transform-origin:center; }
    .card { position:relative; z-index:3; width:min(512px,calc(100% - 40px)); padding:32px 40px 36px; background:var(--bg); border:1px solid var(--border); border-radius:24px; box-shadow:var(--shadow); }
    .progress { margin-bottom:28px; }
    .progress-bars { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
    .progress-bars span { height:3px; border-radius:9px; background:var(--border); opacity:.55; transition:background-color 220ms,opacity 220ms; }
    .progress-bars span.done { background:var(--fg); opacity:1; }
    .progress-label { display:flex; align-items:center; justify-content:space-between; margin-top:11px; font-size:10px; color:var(--muted); letter-spacing:.04em; }
    .step-count { font-variant-numeric:tabular-nums; }
    .panel-host { position:relative; }
    .panel { width:100%; }
    .panel-header { text-align:center; margin-bottom:28px; }
    .emblem { display:flex; align-items:center; justify-content:center; width:58px; height:58px; margin:0 auto 20px; background:var(--selected); border:1px solid var(--border); border-radius:16px; }
    .emblem svg { width:24px; height:24px; }
    .emblem.brand { width:68px; height:68px; background:transparent; border:0; }
    .emblem img { width:68px; height:68px; object-fit:contain; }
    h1 { font-size:25px; line-height:34px; letter-spacing:-.025em; font-weight:650; margin:0 0 8px; outline:none; }
    .panel[data-step="0"] h1 { font-size:28px; line-height:38px; }
    .panel-header p { font-size:13px; line-height:21px; color:var(--muted); margin:0; }
    .panel-header a { color:var(--accent); text-underline-offset:3px; }
    .field-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
    .field-heading label { font-size:13px; font-weight:500; }
    .text-button { border:0; background:none; color:var(--muted); padding:2px 0; font-size:11px; text-decoration:underline; text-underline-offset:3px; }
    .input-wrap { display:flex; align-items:center; height:46px; border:1px solid var(--border); border-radius:12px; background:var(--bg); padding:0 13px; gap:12px; transition:border-color 150ms,box-shadow 150ms; }
    .input-wrap:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent); }
    .input-wrap.invalid { border-color:var(--error); box-shadow:0 0 0 3px color-mix(in srgb,var(--error) 8%,transparent); }
    .input-wrap>svg { width:15px; height:15px; color:var(--muted); }
    .input-wrap input { min-width:0; flex:1; width:100%; border:0; outline:0; background:none; color:var(--fg); font-size:13px; }
    input::placeholder,textarea::placeholder { color:var(--muted); opacity:.65; }
    .eye { display:flex; align-items:center; justify-content:center; padding:4px; border:0; background:transparent; color:var(--muted); border-radius:4px; }
    .eye svg { width:15px; height:15px; }
    .field-error { display:grid; grid-template-rows:0fr; opacity:0; transition:grid-template-rows 200ms,opacity 200ms; color:var(--error); font-size:11px; line-height:19px; }
    .field-error>div { min-height:0; overflow:hidden; }
    .field-error.show { grid-template-rows:1fr; opacity:1; }
    .field-error.show>div { padding-top:8px; }
    .demo-hint { color:var(--muted); font-size:10px; line-height:18px; margin:9px 0 0; }
    .choices { position:relative; display:grid; gap:10px; }
    .choices.horizontal { grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .choices.work-modes { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .selection-surface { position:absolute; z-index:0; top:0; left:0; border:1px solid var(--fg); background:var(--selected); border-radius:12px; pointer-events:none; }
    .selection-surface.ready { transition:transform 200ms cubic-bezier(.2,.7,.3,1),width 200ms,height 200ms,background-color 180ms; }
    .choice { position:relative; z-index:1; display:flex; gap:12px; align-items:flex-start; width:100%; padding:15px; text-align:left; background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:12px; transition:border-color 160ms,color 160ms; }
    .choice:hover { color:var(--fg); }
    .choice[aria-checked="true"] { border-color:transparent; color:var(--fg); }
    .choice>svg { margin:1px 0 0 auto; width:16px; height:16px; }
    .theme-choice { flex-direction:column; align-items:center; gap:10px; text-align:center; padding:20px 8px; font-size:13px; font-weight:500; }
    .theme-choice>svg { margin:0; width:20px; height:20px; transition:transform 180ms; }
    .theme-choice[aria-checked="true"]>svg { transform:scale(1.06); }
    .radio { width:18px; height:18px; border:1.5px solid var(--border); border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; transition:border-color 160ms; }
    .radio::after { content:""; width:9px; height:9px; background:var(--fg); border-radius:50%; transform:scale(0); transition:transform 180ms cubic-bezier(.2,.8,.3,1.2); }
    .choice[aria-checked="true"] .radio { border-color:var(--fg); }
    .choice[aria-checked="true"] .radio::after { transform:scale(1); }
    .choice-copy { min-width:0; flex:1; }
    .choice-title { display:block; font-size:13px; line-height:20px; font-weight:550; }
    .choice-description { display:block; font-size:11px; line-height:18px; margin-top:4px; }
    .recommended { font-size:10px; font-weight:400; color:var(--muted); margin-left:7px; }
    .work-choice { flex-direction:column; gap:11px; padding:16px; }
    .work-choice .choice-top { display:flex; justify-content:space-between; width:100%; }
    .work-choice .choice-top svg { width:17px; height:17px; }
    .language-wrap { position:relative; }
    .language-trigger { width:100%; height:46px; padding:0 15px; display:flex; align-items:center; justify-content:space-between; border:1px solid var(--border); border-radius:12px; color:var(--fg); background:transparent; font-size:13px; text-align:left; }
    .language-trigger svg { color:var(--muted); width:16px; height:16px; transition:transform 180ms; }
    .language-trigger[aria-expanded="true"] svg { transform:rotate(180deg); }
    .language-menu { position:absolute; z-index:20; left:0; right:0; top:calc(100% + 8px); max-height:224px; overflow:auto; padding:5px; background:var(--bg); border:1px solid var(--border); border-radius:12px; box-shadow:0 10px 30px -8px rgba(0,0,0,.2); transform-origin:top; overscroll-behavior:contain; }
    .language-option { width:100%; display:flex; align-items:center; justify-content:space-between; padding:10px; text-align:left; border:0; border-radius:7px; color:var(--fg); background:transparent; font-size:12px; }
    .language-option:hover,.language-option:focus-visible { background:var(--selected); outline:0; }
    .language-option svg { width:14px; height:14px; }
    .panel-footer { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:26px; height:46px; }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:46px; border-radius:12px; border:1px solid var(--border); padding:0 22px; font-size:13px; font-weight:550; background:transparent; color:var(--muted); white-space:nowrap; transition:background-color 160ms,color 160ms,opacity 160ms; }
    .button:hover { background:var(--hover); color:var(--fg); }
    .primary { flex:1; background:var(--fg); color:var(--bg); border-color:transparent; }
    .primary:hover { background:var(--fg); color:var(--bg); opacity:.9; }
    .primary:active { opacity:.8; }
    .primary:disabled { opacity:.42; }
    .primary[data-state="connecting"],.primary[data-state="success"],.primary[data-state="error"] { opacity:1; }
    .connect-slot { flex:1; display:flex; justify-content:center; height:46px; }
    .connect-slot .primary { flex:none; width:100%; min-width:0; padding-inline:0; overflow:hidden; }
    .button-content { display:flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; }
    .spinner { animation:spin .9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .dock { position:absolute; inset:auto 0 0; min-height:58px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 20px; background:var(--bg); color:var(--muted); border-top:1px solid var(--border); z-index:30; font-size:11px; }
    .dock-controls { display:flex; align-items:center; gap:8px; }
    .dock select,.dock button { border:1px solid var(--border); border-radius:7px; background:transparent; color:var(--fg); height:29px; padding:0 10px; font-size:11px; }
    .dock select { max-width:150px; }
    .dock button:hover { background:var(--hover); }
    .dock .dock-brand { letter-spacing:.03em; margin-right:10px; color:var(--fg); font-weight:550; }
    .dock .status { font-size:10px; text-align:right; max-width:360px; }
    .theme-changing .door,.theme-changing .door::before,.theme-changing .card,.theme-changing .emblem,.theme-changing .choice,.theme-changing .button,.theme-changing .sidebar,.theme-changing .stage { transition:background-color 220ms,color 220ms,border-color 220ms; }
    @media(max-width:700px) { .dock { padding:9px 12px; gap:8px; flex-wrap:wrap; min-height:92px; } .dock .status { width:100%; max-width:none; text-align:left; } .dock .dock-brand { display:none; } .stage { bottom:92px; } .card { padding:24px; width:calc(100% - 28px); border-radius:20px; } .progress { margin-bottom:22px; } .panel-header { margin-bottom:24px; } .emblem { width:50px; height:50px; margin-bottom:16px; } .emblem.brand,.emblem img { width:60px; height:60px; } h1 { font-size:23px; } .panel[data-step="0"] h1 { font-size:26px; } .workspace { grid-template-columns:1fr; } .sidebar { display:none; } .workspace-main { padding:24px; } .app-name { display:none; } }
    @media(max-height:690px) { .stage { overflow:auto; } .overlay { min-height:560px; } .progress { margin-bottom:18px; } .card { padding-top:24px; padding-bottom:24px; } .panel-header { margin-bottom:20px; } .emblem { margin-bottom:14px; width:46px; height:46px; } .choice { padding:11px 13px; } .panel-footer { margin-top:22px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; animation:none!important; } }
  </style>
</head>

      if(step===1) return `<div class="choices horizontal" data-group="theme" role="radiogroup" aria-label="系统主题"><div class="selection-surface"></div>${[['light','浅色','Sun'],['dark','深色','Moon'],['system','系统','Monitor']].map(([value,label,icon])=>`<button type="button" class="choice theme-choice" data-action="choose" data-value="${value}" role="radio" aria-checked="false">${icons[icon]}<span>${label}</span></button>`).join('')}</div>`;
      if(step===2) return `<div class="language-wrap"><button class="language-trigger" type="button" data-action="language" aria-haspopup="listbox" aria-expanded="false" aria-controls="language-menu"><span class="language-label">${languages.find(item=>item[0]===state.language)[1]}</span>${icons.ChevronDown}</button><div class="language-menu" id="language-menu" role="listbox" aria-label="系统语言" hidden>${languages.map(([value,label])=>`<button class="language-option" type="button" role="option" aria-selected="${value===state.language}" data-action="language-option" data-value="${value}"><span>${label}</span>${value===state.language?icons.Check:''}</button>`).join('')}</div></div>`;
      if(step===3) return `<div class="choices" data-group="sandbox" role="radiogroup" aria-label="沙箱权限"><div class="selection-surface"></div>${choice('read_only','只读模式','只能阅读当前项目文件，不能修改文件。','Eye')}${choice('workspace_write','项目内读写','允许读取和修改当前项目，推荐日常开发使用。','FolderOpen',true)}${choice('full_access','完全访问','允许读写项目外文件，适合跨目录操作时使用。','LockOpen')}</div>`;
      return `<div class="choices work-modes" data-group="work" role="radiogroup" aria-label="工作模式"><div class="selection-surface"></div>${choice('code','适用于编程','更具技术性的回复和控制','Terminal',false,true)}${choice('daily','适用于日常工作','同样强大，技术细节更少','MessagesSquare',false,true)}</div>`;
    }
    function createPanel(step) {
      const meta=steps[step],panel=document.createElement('section');panel.className='panel';panel.dataset.step=String(step);
      panel.innerHTML=`<header class="panel-header"><div class="emblem ${meta.icon==='brand'?'brand':''}">${meta.icon==='brand'?`<img src="${logo}" alt="DeepAgent Studio"/>`:icons[meta.icon]}</div><h1 tabindex="-1">${meta.title}</h1><p>${meta.description}</p></header><div class="panel-body">${content(step)}</div><footer class="panel-footer">${step?'<button class="button" type="button" data-action="back">上一步</button>':''}${step===0?'<div class="connect-slot"><button class="button primary" type="button" data-action="connect" disabled data-state="idle"><span class="button-content">确定连接</span></button></div>':`<button class="button primary" type="button" data-action="${step===4?'finish':'next'}">${step===4?icons.Check+'进入系统':'下一步'}</button>`}</footer>`;
      if(step===0) panel.querySelector('input').value=state.key;
      return panel;
    }
    function syncSelection(panel) {
      for(const group of panel.querySelectorAll('[data-group]')) {
        const value=state[group.dataset.group];let selected;
        for(const button of group.querySelectorAll('[data-value]')) {const checked=button.dataset.value===value;button.setAttribute('aria-checked',String(checked));if(checked) selected=button;}
        if(!selected) continue;
        const surface=group.querySelector('.selection-surface');surface.style.width=selected.offsetWidth+'px';surface.style.height=selected.offsetHeight+'px';surface.style.transform=`translate(${selected.offsetLeft}px,${selected.offsetTop}px)`;if(!surface.classList.contains('ready')) {void surface.offsetWidth;surface.classList.add('ready');}
      }
    }
    async function go(next) {
      if(state.busy||state.moving||state.finishing||next<0||next>4) return;
      const run=epoch,direction=next>state.step?1:-1,old=currentPanel;
      closeLanguage(); state.moving=true; host.setAttribute('inert','');host.setAttribute('aria-busy','true');
      const oldHeight=host.getBoundingClientRect().height,newPanel=createPanel(next);newPanel.style.cssText='position:absolute;left:0;top:0;opacity:0;';host.appendChild(newPanel);syncSelection(newPanel);
      const newHeight=newPanel.getBoundingClientRect().height;host.style.height=oldHeight+'px';host.style.overflow='hidden';state.step=next;updateProgress();
      const list=[animation(old,[{opacity:1,transform:'translateX(0)'},{opacity:0,transform:`translateX(${-18*direction}px)`}],180),animation(newPanel,[{opacity:0,transform:`translateX(${18*direction}px)`},{opacity:1,transform:'translateX(0)'}],240,{delay:40}),animation(host,[{height:oldHeight+'px'},{height:newHeight+'px'}],280)];
      if(!await settle(list)||run!==epoch) return;
      old.remove();newPanel.style.cssText='';currentPanel=newPanel;host.style.height='auto';release(list);host.style.overflow='';host.removeAttribute('inert');host.removeAttribute('aria-busy');state.moving=false;syncSelection(currentPanel);updateKeyButton();newPanel.querySelector('h1').focus({preventScroll:true});setStatus(steps[next].name+' · '+(next+1)+' / 5');
    }
    function updateKeyButton() {if(state.step!==0) return;const button=currentPanel.querySelector('[data-action="connect"]');button.disabled=!state.key.trim()||state.busy;}
    function showError(show) {const field=currentPanel.querySelector('.input-wrap'),error=currentPanel.querySelector('.field-error');if(!field||!error)return;field.classList.toggle('invalid',show);error.classList.toggle('show',show);error.setAttribute('aria-hidden',String(!show));currentPanel.querySelector('input').setAttribute('aria-invalid',String(show));if(show)error.firstElementChild.textContent='连接失败，请检查 API Key 后重试。';}
    async function connect() {
      if(state.busy||state.moving||state.finishing||!state.key.trim())return;
      const run=epoch,outcome=scenario.value;state.attempt++;state.busy=true;scenario.disabled=true;showError(false);
      const button=currentPanel.querySelector('[data-action="connect"]'),input=currentPanel.querySelector('input'),width=button.getBoundingClientRect().width;
      input.readOnly=true;button.disabled=true;button.dataset.state='connecting';button.setAttribute('aria-label','正在连接');button.setAttribute('aria-busy','true');button.firstElementChild.innerHTML=icons.LoaderCircle;button.querySelector('svg').classList.add('spinner');setStatus('模拟连接中…');
      const shrink=animation(button,[{width:width+'px',borderRadius:'12px'},{width:'46px',borderRadius:'23px'}],380);
      if(!await wait(1250)||run!==epoch)return;
      if(!await settle([shrink])||run!==epoch)return;
      const success=outcome==='success'||(outcome==='retry'&&state.attempt>1);
      button.dataset.state=success?'success':'error';button.firstElementChild.innerHTML=success?icons.Check+'连接成功':'重试连接';button.setAttribute('aria-label',success?'连接成功':'重试连接');
      const expand=animation(button,[{width:'46px',borderRadius:'23px'},{width:width+'px',borderRadius:'12px'}],380);
      if(!await settle([expand])||run!==epoch)return;
      release([shrink,expand]);button.removeAttribute('aria-busy');
      if(success) {if(!await wait(reduced()?0:250)||run!==epoch)return;state.busy=false;scenario.disabled=false;await go(1);}
      else {state.busy=false;scenario.disabled=false;input.readOnly=false;button.disabled=false;showError(true);setStatus('连接失败 · 可修改输入，或直接重试');input.focus({preventScroll:true});}
    }
    function closeLanguage() {const menu=currentPanel?.querySelector('.language-menu'),trigger=currentPanel?.querySelector('.language-trigger');if(!menu)return;menu.hidden=true;trigger.setAttribute('aria-expanded','false');}
    async function toggleLanguage() {
      const menu=currentPanel.querySelector('.language-menu'),trigger=currentPanel.querySelector('.language-trigger');if(!menu.hidden){const run=epoch;trigger.setAttribute('aria-expanded','false');const track=animation(menu,[{opacity:1,transform:'translateY(0) scale(1)'},{opacity:0,transform:'translateY(-4px) scale(.98)'}],140);if(await settle([track])&&run===epoch){menu.hidden=true;release([track]);}return;}
      menu.hidden=false;trigger.setAttribute('aria-expanded','true');const track=animation(menu,[{opacity:0,transform:'translateY(-4px) scale(.98)'},{opacity:1,transform:'translateY(0) scale(1)'}],160);await settle([track]);release([track]);
    }
    async function finish() {
      if(state.busy||state.moving||state.finishing)return;
      const run=epoch;state.finishing=true;scenario.disabled=true;currentPanel.setAttribute('inert','');const button=currentPanel.querySelector('[data-action="finish"]');button.disabled=true;button.innerHTML=icons.LoaderCircle+'保存中…';button.querySelector('svg').classList.add('spinner');setStatus('模拟保存设置…');
      if(!await wait(250)||run!==epoch)return;
      entrance=startOnboardingEntrance({overlay,card,welcome:document.querySelector('#welcome'),point:document.querySelector('#point'),doors:[...document.querySelectorAll('.door')],seams:[...document.querySelectorAll('.seam')]},reduced());
      setStatus('欢迎入场 · 文字 → 点 → 线 → 开门');const completed=await entrance.finished;if(!completed||run!==epoch)return;
      overlay.hidden=true;workspace.removeAttribute('inert');workspace.removeAttribute('aria-hidden');scenario.disabled=false;setStatus('已进入工作台示意 · 点击“重新开始”再次体验');workspace.querySelector('textarea').focus({preventScroll:true});
    }
    function reset(start=0) {
      epoch++;entrance?.cancel();entrance=null;release([...tracks]);for(const pending of waits){clearTimeout(pending.timer);pending.resolve(false);}waits.clear();state=initial();state.step=start;
      overlay.hidden=false;workspace.setAttribute('inert','');workspace.setAttribute('aria-hidden','true');workspace.querySelector('textarea').value='';host.style.cssText='';host.removeAttribute('inert');host.removeAttribute('aria-busy');currentPanel=createPanel(start);host.replaceChildren(currentPanel);scenario.disabled=false;setTheme(state.theme);syncSelection(currentPanel);updateProgress();updateKeyButton();setStatus('本地模拟 · 不验证或保存密钥');
    }
    async function action(button) {
      if(state.busy||state.moving||state.finishing)return;
      const name=button.dataset.action;
      if(name==='next')return go(state.step+1);
      if(name==='back')return go(state.step-1);
      if(name==='connect')return connect();
      if(name==='finish')return finish();
      if(name==='demo-key'){state.key='sk-demo-preview';currentPanel.querySelector('input').value=state.key;showError(false);updateKeyButton();return;}
      if(name==='eye'){const input=currentPanel.querySelector('input'),visible=input.type==='password';input.type=visible?'text':'password';button.innerHTML=icons[visible?'EyeOff':'Eye'];button.setAttribute('aria-label',visible?'隐藏演示密钥':'显示演示密钥');return;}
      if(name==='choose'){const group=button.closest('[data-group]').dataset.group;state[group]=button.dataset.value;if(group==='theme')setTheme(state.theme);syncSelection(currentPanel);return;}
      if(name==='language')return toggleLanguage();
      if(name==='language-option'){state.language=button.dataset.value;const label=currentPanel.querySelector('.language-label');label.textContent=languages.find(item=>item[0]===state.language)[1];for(const option of currentPanel.querySelectorAll('.language-option')){const checked=option.dataset.value===state.language;option.setAttribute('aria-selected',String(checked));option.innerHTML='<span>'+languages.find(item=>item[0]===option.dataset.value)[1]+'</span>'+(checked?icons.Check:'');}closeLanguage();currentPanel.querySelector('.language-trigger').focus();const track=animation(label,[{opacity:.25,transform:'translateY(3px)'},{opacity:1,transform:'translateY(0)'}],160);await settle([track]);release([track]);}
    }
    function report(error) {if(error.name==='AbortError')return;console.error('Onboarding preview failed:',error);reset();setStatus('预览播放失败，请重试');}
    card.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(button)void action(button).catch(report);});
    card.addEventListener('input',event=>{if(event.target.id!=='api-key')return;state.key=event.target.value;showError(false);updateKeyButton();});
    card.addEventListener('keydown',event=>{
      if(state.busy||state.moving||state.finishing)return;
      if(event.target.id==='api-key'&&event.key==='Enter'){event.preventDefault();void connect().catch(report);}
      if(event.key==='Escape'){closeLanguage();currentPanel.querySelector('.language-trigger')?.focus();}
      const group=event.target.closest('[role="radiogroup"]');if(group&&['ArrowLeft','ArrowUp','ArrowRight','ArrowDown'].includes(event.key)){event.preventDefault();const buttons=[...group.querySelectorAll('[role="radio"]')],index=buttons.indexOf(event.target),delta=['ArrowLeft','ArrowUp'].includes(event.key)?-1:1,next=buttons[(index+delta+buttons.length)%buttons.length];next.focus();void action(next).catch(report);}
      if(event.target.closest('.language-wrap')&&['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();const menu=currentPanel.querySelector('.language-menu');if(menu.hidden){void toggleLanguage().then(()=>menu.querySelector('[aria-selected="true"]').focus()).catch(report);}else{const options=[...menu.querySelectorAll('button')],index=options.indexOf(event.target),delta=event.key==='ArrowDown'?1:-1;options[(index+delta+options.length)%options.length].focus();}}
    });
    document.addEventListener('click',event=>{if(!event.target.closest('.language-wrap'))closeLanguage();});
    document.querySelector('#reset').addEventListener('click',()=>reset());
    document.querySelector('#last').addEventListener('click',()=>reset(4));
    addEventListener('resize',()=>{if(currentPanel&&!state.moving&&!state.finishing)syncSelection(currentPanel);});
    addEventListener('pagehide',()=>{epoch++;entrance?.cancel();release([...tracks]);for(const pending of waits){clearTimeout(pending.timer);pending.resolve(false);}waits.clear();});
    reset();
    const intro=[animation(card,[{opacity:0,transform:'translateY(10px) scale(.985)'},{opacity:1,transform:'translateY(0) scale(1)'}],350)];
    void settle(intro).then(()=>release(intro));
  </script>
</body>
