[package]
name = "deepagent-desktop"
version = "0.0.1"
edition = "2021"
description = "DeepAgent Studio desktop shell (Tauri v2)."
license = "Apache-2.0"

# This crate is intentionally NOT a member of the root workspace: Tauri apps
# carry their own dependency tree (and a separate target dir) so the kernel
# workspace stays lean. The empty `[workspace]` table below makes Cargo treat
# this manifest as its own workspace root rather than erroring that it "believes
# it's in a workspace when it's not".
[workspace]

[profile.dev]
# Windows often keeps files in target/debug/incremental locked while Tauri dev,
# rust-analyzer, or antivirus/indexing is active. Disabling incremental for the
# desktop shell avoids noisy "error finalizing incremental compilation session"
# warnings and failed rebuilds caused by transient OS file locks.
incremental = false

[lib]
name = "deepagent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Enable the OS keychain so the API key is stored in Windows Credential Manager
# / macOS Keychain / Linux Secret Service — never in plaintext on disk.
deepagent-app-core = { path = "../../../crates/deepagent-app-core", features = ["keychain", "web"] }
deepagent-core = { path = "../../../crates/deepagent-core" }
deepagent-models = { path = "../../../crates/deepagent-models", features = ["http"] }
tauri-plugin-dialog = "2.7.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tempfile = "3.8"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
