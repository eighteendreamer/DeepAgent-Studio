[package]
name = "deepagent-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Interactive and headless DeepAgent Harness CLI."

[[bin]]
name = "deepagent"
path = "src/main.rs"

[dependencies]
# `keychain` so the terminal unwraps the SQLite master key with the same OS
# credential the desktop stored — one credential for both hosts.
deepagent-app-core = { workspace = true, features = ["keychain"] }
deepagent-builtins.workspace = true
deepagent-core.workspace = true
deepagent-harness-protocol.workspace = true
deepagent-models = { workspace = true, features = ["http"] }
deepagent-persistence.workspace = true
deepagent-session.workspace = true
deepagent-runtime.workspace = true
deepagent-tracing.workspace = true
serde_json.workspace = true
serde.workspace = true
aes-gcm.workspace = true
base64.workspace = true
tracing.workspace = true
tokio.workspace = true
futures.workspace = true
crossterm.workspace = true
ratatui.workspace = true
unicode-width.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
insta.workspace = true
