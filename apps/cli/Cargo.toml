[package]
name = "deepagent-cli"
version.workspace = true
edition.workspace = true
# Local override: the workspace claims 1.80, but ratatui 0.30 requires 1.88 and
# this is the only crate that pulls it in.
rust-version = "1.88"
license.workspace = true
authors.workspace = true
description = "Interactive and headless DeepAgent Harness CLI."

[[bin]]
name = "deepagent"
path = "src/main.rs"

[dependencies]
deepagent-app-core.workspace = true
deepagent-core.workspace = true
deepagent-harness-protocol.workspace = true
deepagent-models = { workspace = true, features = ["http"] }
deepagent-persistence.workspace = true
deepagent-session.workspace = true
deepagent-runtime.workspace = true
deepagent-tracing.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
futures.workspace = true
crossterm.workspace = true
ratatui.workspace = true
unicode-width.workspace = true

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
