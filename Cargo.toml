# DeepAgent Studio — Rust Workspace
# Agent Runtime Operating System
#
# This virtual manifest defines the full Runtime Kernel crate graph described in
# 开发提示词.md / 开发计划.md. Crates are introduced incrementally per phase; each
# is a real, compiling member of the workspace.

[workspace]
resolver = "2"
members = [
    "crates/deepagent-core",
    "crates/deepagent-tracing",
    "crates/deepagent-persistence",
    "crates/deepagent-session",
    "crates/deepagent-context",
    "crates/deepagent-memory",
    "crates/deepagent-knowledge",
    "crates/deepagent-tools",
    "crates/deepagent-builtins",
    "crates/deepagent-intent",
    "crates/deepagent-skills",
    "crates/deepagent-prompts",
    "crates/deepagent-runtime",
    "crates/deepagent-models",
    "crates/deepagent-hooks",
    "crates/deepagent-workspace",
    "crates/deepagent-verification",
    "crates/deepagent-planner",
    "crates/deepagent-subagents",
    "crates/deepagent-observation",
    "crates/deepagent-security",
    "crates/deepagent-app-core",
    "crates/deepagent-mcp",
    "crates/deepagent-codegraph",
    "crates/deepagent-ssh",
    "crates/deepagent-vision",
    "apps/cli",
]
# The Tauri desktop shell is its own workspace root (it carries the WebView
# toolchain dependency tree). Exclude it so this kernel workspace ignores it.
exclude = ["apps/desktop/src-tauri"]

# Phase placeholders (created in later phases):
#   deepagent-prompts      (Phase 11)
#   deepagent-planner      (Phase 6)
#   deepagent-hooks        (Phase 2/3)
#   deepagent-cache        (Phase 3)
#   deepagent-subagents    (Phase 6)
#   deepagent-observation  (Phase 10)
#   deepagent-verification (Phase 7)
#   deepagent-security     (Phase 9)
#   deepagent-mcp          (Phase 12)
#   deepagent-models       (Phase 2)
#   deepagent-workspace    (Phase 3)

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
authors = ["DeepAgent Studio"]
repository = "https://github.com/deepagent-studio/deepagent-studio"

[workspace.dependencies]
# Internal crates
deepagent-core = { path = "crates/deepagent-core" }
deepagent-tracing = { path = "crates/deepagent-tracing" }
deepagent-persistence = { path = "crates/deepagent-persistence" }
deepagent-session = { path = "crates/deepagent-session" }
deepagent-context = { path = "crates/deepagent-context" }
deepagent-memory = { path = "crates/deepagent-memory" }
deepagent-knowledge = { path = "crates/deepagent-knowledge" }
deepagent-tools = { path = "crates/deepagent-tools" }
deepagent-builtins = { path = "crates/deepagent-builtins" }
deepagent-intent = { path = "crates/deepagent-intent" }
deepagent-skills = { path = "crates/deepagent-skills" }
deepagent-prompts = { path = "crates/deepagent-prompts" }
deepagent-runtime = { path = "crates/deepagent-runtime" }
deepagent-models = { path = "crates/deepagent-models" }
deepagent-hooks = { path = "crates/deepagent-hooks" }
deepagent-workspace = { path = "crates/deepagent-workspace" }
deepagent-verification = { path = "crates/deepagent-verification" }
deepagent-planner = { path = "crates/deepagent-planner" }
deepagent-subagents = { path = "crates/deepagent-subagents" }
deepagent-observation = { path = "crates/deepagent-observation" }
deepagent-security = { path = "crates/deepagent-security" }
deepagent-app-core = { path = "crates/deepagent-app-core" }
deepagent-mcp = { path = "crates/deepagent-mcp" }
deepagent-codegraph = { path = "crates/deepagent-codegraph" }
deepagent-ssh = { path = "crates/deepagent-ssh" }
deepagent-vision = { path = "crates/deepagent-vision" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.18", default-features = false }

# Errors
thiserror = "1"
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Identifiers & time
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

# Persistence
rusqlite = { version = "0.31", features = ["bundled"] }

# Code graph: tree-sitter parsing + pure-Rust-compilable grammars (C grammar
# built locally via cc; no Node.js, no runtime grammar download).
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"

# File walking + .gitignore handling
ignore = "0.4"

# Office document parsing (file preview + office tools): zip for OOXML
# container access (docx/pptx), calamine for xlsx sheet reading. Pure Rust,
# no external runtime — this is the Tier C fallback for office previews.
zip = "2"
calamine = "0.26"
# Pure-Rust PDF text extraction (Tier C). Page rasterization is a Tier R
# upgrade (pdfium) handled later; this gives a text-only degrade path.
pdf-extract = "0.7"

# Content hashing (incremental change detection)
blake3 = "1"

# SHA-256 for verifying downloaded managed runtimes (office-agent RuntimeService).
sha2 = "0.10"

# Archive extraction for managed runtimes distributed as .tar.gz (pandoc /
# pdfium ship tarballs on some platforms). Pure Rust.
tar = "0.4"
flate2 = "1"

# PDF page rendering (office-agent Tier R, behind the `pdfium` feature).
# pdfium-render dynamically loads the pdfium library at runtime, so it compiles
# without the binary present. `image` encodes the rendered pages to PNG.
pdfium-render = "0.8"
image = "0.25"

# HTTP client for downloading managed runtimes (office-agent). Used behind the
# app-core `runtimes` feature; rustls so no system OpenSSL is required.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# Audio capture for the recording panel (office-agent): cpal for cross-platform
# microphone input, hound for writing 16kHz mono PCM WAV. Pure Rust.
cpal = "0.15"
hound = "3.5"

# In-process speech transcription engine (office-agent). Statically links
# whisper.cpp — needs a C/C++ toolchain (+ cmake) to build, so it is gated
# behind the app-core `whisper` feature and OFF by default.
whisper-rs = "0.12"

# Pure-Rust xlsx writer (office-agent Tier C document generation). No external
# runtime — used by OfficeService to materialize spreadsheets.
rust_xlsxwriter = "0.79"

# Testing
tempfile = "3"
